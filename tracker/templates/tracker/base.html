<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}gonext{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f14; --card:#161a22; --border:#242a36;
    --text:#e8eaed; --muted:#9aa3b2;
    --accent:#ff5500; --green:#3ddc84; --red:#ff4d4d;
    --amber:#ffb020; --gold:#ffd447;
    --radius:14px; --gap:16px;
  }
  * {
     box-sizing:border-box;
     }
  body {
    background:
      radial-gradient(1200px 400px at 50% -200px, #1a1420 0%, transparent 70%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    max-width:680px; margin:0 auto; padding:32px 16px 64px;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  nav {
    display:flex; gap:20px; align-items:center;
    margin-bottom:28px; font-size:14px; font-weight:500;
  }
  nav .brand {
    font-weight:800; font-size:20px; letter-spacing:-.02em;
    color:var(--text); margin-right:auto;
  }
  nav .brand span { color:var(--accent); }
  nav a { color:var(--muted); text-decoration:none; transition:color .15s; }
  nav a:hover, nav a.active { color:var(--text); }
  form { display:flex; gap:8px; margin-bottom:24px; }
  input {
    flex:1; padding:12px 16px; border-radius:10px;
    border:1px solid var(--border); background:#10141b;
    color:var(--text); font-size:16px; font-family:inherit;
    transition:border-color .15s;
  }
  input:focus { outline:none; border-color:var(--accent); }
  button {
    padding:12px 22px; border-radius:10px; border:0;
    background:var(--accent); color:#fff; font-weight:600;
    font-size:15px; font-family:inherit; cursor:pointer;
    transition:filter .15s;
  }
  button:hover { filter:brightness(1.1); }
  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px 24px;
    margin-bottom:var(--gap);
  }
  .sub { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:right; padding:9px 6px; border-bottom:1px solid var(--border); }
  th { font-weight:600; color:var(--muted); font-size:12px;
       text-transform:uppercase; letter-spacing:.04em; }
  th:first-child, td:first-child { text-align:left; }
  td:first-child { color:var(--muted); }
  tr:last-child td { border-bottom:0; }
  a { color:var(--accent); }
  .error { color:var(--red); }
  .W { color:var(--green); } .L { color:var(--red); }
  .QUEUE-text { color:var(--green); }
  .RISKY-text { color:var(--amber); }
  .STOP-text  { color:var(--red); }
  .BANKIT-text{ color:var(--gold); }
  
  .sess {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 18px;
    margin-bottom:10px; display:flex; align-items:center;
    justify-content:space-between; gap:16px;
    transition:border-color .15s;
  }
  .sess:hover { border-color:#333b4a; }
  .sess .wl {
    font-family:'Inter',monospace; font-size:18px;
    font-weight:700; letter-spacing:3px; margin-bottom:4px;
  }
  .sess .meta { color:var(--muted); font-size:13px; }
  .sess .kd {
    font-size:20px; font-weight:700; white-space:nowrap;
    color:var(--text);
  }
  
  .QUEUE-text { color:var(--green); }
  .RISKY-text { color:var(--amber); }
  .STOP-text  { color:var(--red); }
  .BANKIT-text{ color:var(--gold); }
  .hero .big { font-size:44px; font-weight:800; letter-spacing:-.02em; color:var(--accent); line-height:1.1; }
  .hero .record { font-size:22px; font-weight:700; }
  .win { color:var(--green); } .loss { color:var(--red); }
</style>
</head>
<body>
<nav>
  <div class="brand">go<span>next</span></div>
  <a href="/?nickname={{ nickname }}" class="{% block nav_verdict %}{% endblock %}">verdict</a>
  <a href="/stats/?nickname={{ nickname }}" class="{% block nav_stats %}{% endblock %}">stats</a>
  <a href="/history/?nickname={{ nickname }}" class="{% block nav_history %}{% endblock %}">history</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
